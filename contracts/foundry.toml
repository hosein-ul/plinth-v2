[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# paris: no PUSH0 / transient storage, so the same bytecode is portable to every
# EVM chain in the registry without per-chain opcode verification.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Default metadata (IPFS hash + CBOR) stays on so explorers can prove an exact source match.
# Contracts deployed before 2026-10-23 on Arc mainnet were built without it and only show a partial match.
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false
