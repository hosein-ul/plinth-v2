<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Plinth — product walkthrough</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "General Sans"; font-weight: 400; src: url("assets/fonts/GeneralSans-400.woff2") format("woff2"); }
      @font-face { font-family: "General Sans"; font-weight: 500; src: url("assets/fonts/GeneralSans-500.woff2") format("woff2"); }
      @font-face { font-family: "General Sans"; font-weight: 600; src: url("assets/fonts/GeneralSans-600.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("assets/fonts/JetBrainsMono-400.ttf") format("truetype"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/JetBrainsMono-500.ttf") format("truetype"); }
      :root { --ink: #0c1220; --deep: #080d19; --lift: #121a2c; --rise: #19233a; --mint: #0ea66b; --mint2: #34d399; --ground: #f3f5f8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--deep); font-family: "General Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--deep); }
      .abs { position: absolute; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .fv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; transform-origin: 50% 50%; will-change: transform; }
      .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.1em 0.06em 0.18em; margin: -0.1em -0.06em -0.18em; }
      .wi { display: inline-block; will-change: transform; }

      /* chapter cards */
      .tcard { position: absolute; inset: 0; z-index: 40; background: radial-gradient(70% 80% at 85% 0%, rgba(14, 166, 107, 0.2), transparent 62%), radial-gradient(60% 70% at 8% 100%, rgba(47, 107, 255, 0.1), transparent 65%), linear-gradient(180deg, var(--lift), var(--deep)); color: #fff; overflow: hidden; }
      .tcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 80px 80px, linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 80px 80px; -webkit-mask: radial-gradient(75% 70% at 30% 55%, #000, transparent 85%); mask: radial-gradient(75% 70% at 30% 55%, #000, transparent 85%); }
      .tnum { position: absolute; left: 170px; top: 330px; font-size: 30px; color: var(--mint2); letter-spacing: 0.04em; }
      .tline { position: absolute; left: 170px; top: 392px; width: 120px; height: 4px; border-radius: 3px; background: var(--mint2); transform-origin: left; box-shadow: 0 0 24px rgba(52, 211, 153, 0.6); }
      .tt { position: absolute; left: 170px; top: 430px; font-size: 128px; line-height: 1.06; letter-spacing: -0.05em; font-weight: 500; }
      .tt .l2 { color: rgba(255, 255, 255, 0.46); }

      /* callouts */
      .co { position: absolute; z-index: 30; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 28px 0 22px; border-radius: 999px; background: rgba(8, 13, 25, 0.9); color: #fff; font-size: 30px; font-weight: 500; letter-spacing: -0.015em; white-space: nowrap; box-shadow: 0 20px 50px -16px rgba(8, 13, 25, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.1); transform-origin: 0 50%; }
      .co i { width: 14px; height: 14px; border-radius: 50%; background: var(--mint2); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.25); display: block; flex: none; }
      .co.big { height: 84px; font-size: 44px; padding: 0 36px 0 28px; }
      .ring { position: absolute; z-index: 29; border-radius: 22px; border: 4px solid var(--mint2); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0.18), 0 0 40px rgba(52, 211, 153, 0.35); pointer-events: none; }

      /* captions */
      .cap { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; z-index: 90; pointer-events: none; }
      .cap .box { display: inline-flex; gap: 0.3em; padding: 15px 34px 17px; border-radius: 999px; background: rgba(8, 13, 25, 0.86); box-shadow: 0 18px 50px -18px rgba(8, 13, 25, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.09); font-size: 38px; font-weight: 500; letter-spacing: -0.015em; color: #fff; white-space: nowrap; }
      .cap .cw { opacity: 0.4; }
      .cap.top { bottom: auto; top: 44px; }
      #stepsbar { position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: center; gap: 14px; z-index: 35; opacity: 0; }
      .sp { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 26px 0 18px; border-radius: 999px; background: rgba(8, 13, 25, 0.9); color: rgba(255,255,255,.55); font-size: 28px; font-weight: 500; box-shadow: 0 18px 44px -16px rgba(8,13,25,.7), inset 0 0 0 1px rgba(255,255,255,.1); }
      .sp b { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; color: #04271a; }
      .sp b svg { width: 18px; height: 18px; opacity: 0; }
      #prog { position: absolute; left: 0; top: 0; height: 5px; width: 1920px; background: linear-gradient(90deg, var(--mint), var(--mint2)); transform-origin: left; z-index: 95; box-shadow: 0 0 18px rgba(52, 211, 153, 0.6); }

      /* terminal */
      #term { position: absolute; inset: 0; z-index: 10; background: radial-gradient(70% 80% at 85% 0%, rgba(14, 166, 107, 0.16), transparent 62%), linear-gradient(180deg, var(--lift), var(--deep)); }
      #termwin { position: absolute; left: 230px; top: 120px; width: 1460px; height: 760px; border-radius: 28px; background: #0b1120; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 60px 120px -30px rgba(0, 0, 0, 0.8); overflow: hidden; }
      #termbar { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.5); font-size: 22px; }
      #termbar i { width: 16px; height: 16px; border-radius: 50%; background: #2a3550; display: block; }
      #termbody { padding: 34px 44px; font-size: 27px; line-height: 1.62; color: rgba(255, 255, 255, 0.92); white-space: pre; }
      .dim { color: rgba(255, 255, 255, 0.45); } .g { color: #34d399; } .k { color: #8ab4ff; }

      /* end card */
      #end { position: absolute; inset: 0; z-index: 10; background: radial-gradient(70% 80% at 85% 0%, rgba(14, 166, 107, 0.22), transparent 62%), radial-gradient(60% 70% at 10% 100%, rgba(47, 107, 255, 0.1), transparent 65%), linear-gradient(180deg, var(--lift), var(--deep)); color: #fff; }
      #end::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 80px 80px, linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 80px 80px; -webkit-mask: radial-gradient(75% 70% at 50% 45%, #000, transparent 85%); mask: radial-gradient(75% 70% at 50% 45%, #000, transparent 85%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      <audio id="snd" src="assets/soundtrack.wav" data-start="0" data-duration="{{TOTAL}}" data-volume="1"></audio>

      {{VIDEOS}}

      <!-- terminal: the real request and the real response -->
      <div id="term" class="clip" data-start="{{term.start}}" data-duration="{{term.dur}}">
        <div id="termwin">
          <div id="termbar"><i></i><i></i><i></i><span style="margin-left:18px">zsh — plinth demo</span></div>
          <div id="termbody"></div>
        </div>
      </div>

      <!-- end card -->
      <div id="end" class="clip" data-start="{{end.start}}" data-duration="{{end.dur}}">
        <div class="abs" style="left:0;right:0;top:250px;display:flex;justify-content:center"><img id="e_logo" src="assets/brand/plinth-logo-dark.svg" style="height:190px;display:block" /></div>
        <div id="e_t" class="abs" style="left:0;right:0;top:490px;text-align:center;font-size:92px;line-height:1.06;letter-spacing:-0.045em;font-weight:500"><div id="e_t1">Non-custodial</div><div id="e_t2" style="color:rgba(255,255,255,.46)">stablecoin payments.</div></div>
        <div id="e_arc" class="abs" style="left:0;right:0;top:790px;display:flex;justify-content:center;align-items:center;gap:22px"><span style="font-size:32px;color:rgba(255,255,255,.62)">Built on</span><span style="background:#fff;border-radius:16px;padding:12px 26px;display:flex"><img src="assets/brand/arc-logo.svg" style="height:48px;display:block" /></span></div>
        <div id="e_url" class="abs mono" style="left:0;right:0;top:905px;text-align:center;font-size:28px;color:rgba(255,255,255,.55)">plinth.zerolayer.online</div>
      </div>

      {{CARDS}}
      <div id="stepsbar">{{STEPS}}</div>
      <div id="callouts"></div>
      <div id="caps">{{CAPTIONS}}</div>
      <div id="prog"></div>
    </div>

    <script>
      const D = /*DATA*/null;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const B = Object.fromEntries(D.beats.map((b) => [b.id, b]));
      const C = (id) => D.chunks[id];

      function split(el) {
        const walk = (node) => [...node.childNodes].forEach((n) => {
          if (n.nodeType === 3) {
            const frag = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((p) => {
              if (!p) return;
              if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(' ')); return; }
              const w = document.createElement('span'); w.className = 'w'; const i = document.createElement('span'); i.className = 'wi'; i.textContent = p; w.appendChild(i); frag.appendChild(w);
            });
            n.replaceWith(frag);
          } else if (n.nodeType === 1) walk(n);
        });
        walk(el); return el.querySelectorAll('.wi');
      }
      const rise = (els, t, o = {}) => tl.fromTo(els, { yPercent: 118 }, { yPercent: 0, duration: o.d ?? 0.95, ease: 'expo.out', stagger: o.s ?? 0.07 }, t);

      /* ── camera: scale about a point of the recorded page (css px of the 1280x720 viewport) ── */
      const cam = (cx, cy, s) => {
        const mx = 960 * (s - 1), my = 540 * (s - 1);
        return { scale: s, x: Math.max(-mx, Math.min(mx, -(1.5 * cx - 960) * s)), y: Math.max(-my, Math.min(my, -(1.5 * cy - 540) * s)) };
      };
      const toScreen = (px, py, z) => { const s = z ? z[0] : 1, cx = z ? z[1] : 640, cy = z ? z[2] : 360; const c = cam(cx, cy, s); return [960 + (1.5 * px - 960) * s + c.x, 540 + (1.5 * py - 540) * s + c.y]; };

      /* ── footage beats: dissolve in, camera moves ── */
      D.beats.filter((b) => b.kind === 'footage').forEach((b, i) => {
        const v = '#v_' + b.id;
        gsap.set(v, { zIndex: 1 + i, transformOrigin: '50% 50%' });
        tl.fromTo(v, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'power1.out' }, b.body_start - 0.15);
        (b.zoom || []).forEach(([t, s, cx, cy]) => {
          const c = cam(cx, cy, s);
          tl.to(v, { scale: c.scale, x: c.x, y: c.y, duration: s === 1 ? 0.9 : 1.1, ease: 'power3.inOut' }, b.body_start + t);
        });
      });

      /* ── chapter cards ── */
      D.beats.filter((b) => b.card).forEach((b, i) => {
        const el = '#tc_' + b.scene, t0 = b.start;
        const words = split(document.querySelector(el + ' .l1')), words2 = split(document.querySelector(el + ' .l2'));
        tl.fromTo(el, { clipPath: 'inset(100% 0% 0% 0% round 160px 160px 0px 0px)' }, { clipPath: 'inset(0% 0% 0% 0% round 0px)', duration: 0.5, ease: 'power4.inOut' }, t0);
        tl.fromTo(el + ' .tnum', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, t0 + 0.22);
        tl.fromTo(el + ' .tline', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'expo.out' }, t0 + 0.25);
        rise(words, t0 + 0.28, { s: 0.07, d: 0.8 }); rise(words2, t0 + 0.45, { s: 0.07, d: 0.8 });
        tl.to(el, { clipPath: 'inset(0% 0% 100% 0% round 0px 0px 160px 160px)', duration: 0.5, ease: 'power4.inOut' }, t0 + D.title - 0.45);
      });

      /* ── callouts: a ring around a part of the page and a label, placed in page coordinates ── */
      const callouts = [
        /* filled in below */
      ];
      /*CALLOUTS*/
      const host = document.getElementById('callouts');
      callouts.forEach((c, i) => {
        const b = B[c.beat], t = b.body_start + c.t, z = c.z || null; c.dur = Math.min(c.dur, b.start + b.dur - t - 0.05);
        if (c.ring) {
          const [x0, y0] = toScreen(c.ring[0], c.ring[1], z), [x1, y1] = toScreen(c.ring[0] + c.ring[2], c.ring[1] + c.ring[3], z);
          const r = document.createElement('div'); r.className = 'ring'; r.id = 'ring' + i; r.style.cssText = `left:${x0 - 10}px;top:${y0 - 8}px;width:${x1 - x0 + 20}px;height:${y1 - y0 + 16}px;opacity:0`; host.appendChild(r);
          tl.fromTo(r, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'expo.out' }, t);
          tl.to(r, { opacity: 0, duration: 0.35 }, t + c.dur - 0.35);
        }
        if (c.text) {
          const el = document.createElement('div'); el.className = 'co' + (c.big ? ' big' : ''); el.id = 'co' + i; el.innerHTML = '<i></i>' + c.text;
          el.style.cssText = `left:${c.sx}px;top:${c.sy}px;opacity:0`; host.appendChild(el);
          tl.fromTo(el, { opacity: 0, x: -24, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: 'expo.out' }, t + 0.12);
          tl.to(el, { opacity: 0, y: -10, duration: 0.3, ease: 'power2.in' }, t + c.dur - 0.3);
        }
      });

      /* ── the five settlement steps light up as the narration names them (they mirror the app's own states) ── */
      {
        const b = B.chain, ids = ['e5b', 'e5c', 'e5d', 'e5e', 'e5f'], at = ids.map((id, i) => C(id).start + (i === 4 ? 0.35 : -0.02));
        tl.fromTo('#stepsbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, b.body_start + 0.6);
        document.querySelectorAll('.sp').forEach((el, i) => {
          tl.to(el, { backgroundColor: '#34d399', color: '#04271a', duration: 0.3, ease: 'power2.out' }, at[i]);
          tl.to(el.querySelector('b'), { borderColor: '#0b3d2a', duration: 0.2 }, at[i]);
          tl.to(el.querySelector('svg'), { opacity: 1, duration: 0.2 }, at[i] + 0.05);
          tl.fromTo(el, { scale: 1 }, { scale: 1.07, duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out' }, at[i]);
        });
        tl.to('#stepsbar', { opacity: 0, y: -16, duration: 0.4 }, b.start + b.dur - 0.5);
      }

      /* ── terminal ── */
      {
        const b = B.term, api = D.api, el = document.getElementById('termbody');
        const lines = [
          { s: '<span class="g">$</span> curl -X POST http://localhost:4000/v1/payment-intents \\', n: 1 },
          { s: '    -H "Authorization: Bearer sk_test_…" \\', n: 1 },
          { s: '    -H "Idempotency-Key: ORDER-2041" \\', n: 1 },
          { s: '    -d \'{"amount":"40.00","order_reference":"ORDER-2041"}\'', n: 1 },
          { s: '', n: 0 },
          { s: '<span class="dim">{</span>', n: 0 },
          { s: '  <span class="k">"id"</span>: <span class="g">"' + api.id + '"</span>,', n: 0 },
          { s: '  <span class="k">"status"</span>: <span class="g">"' + api.status + '"</span>,', n: 0 },
          { s: '  <span class="k">"amount"</span>: <span class="g">"' + api.amount + '"</span>, <span class="k">"currency"</span>: <span class="g">"' + api.currency + '"</span>,', n: 0 },
          { s: '  <span class="k">"checkout_url"</span>: <span class="g">"' + api.checkout_url + '"</span>,', n: 0 },
          { s: '  <span class="k">"deposit_address"</span>: <span class="g">"' + api.deposit + '"</span>', n: 0 },
          { s: '<span class="dim">}</span>', n: 0 },
        ];
        const html = lines.map((l, i) => `<div class="tl" id="tl${i}" style="opacity:0">${l.s}</div>`).join('');
        el.innerHTML = html;
        const t0 = b.start;
        tl.fromTo('#termwin', { opacity: 0, y: 70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'expo.out' }, t0 + 0.05);
        lines.forEach((l, i) => {
          if (l.n) { // command lines are typed
            const plain = l.s; const o = { p: 0 }, node = document.getElementById('tl' + i);
            tl.set(node, { opacity: 1 }, t0 + 0.7 + i * 0.55);
            tl.fromTo(o, { p: 0 }, { p: 1, duration: 0.5, ease: 'none', onUpdate: () => { const vis = Math.floor(o.p * plain.replace(/<[^>]+>/g, '').length); let k = 0, out = '', inTag = false; for (const ch of plain) { if (ch === '<') inTag = true; if (inTag) { out += ch; if (ch === '>') inTag = false; continue; } if (k < vis) { out += ch; k++; } } node.innerHTML = out; } }, t0 + 0.7 + i * 0.55);
          } else tl.fromTo('#tl' + i, { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out' }, t0 + 3.0 + (i - 5) * 0.13);
        });
        tl.fromTo('#termwin', { boxShadow: '0 60px 120px -30px rgba(0,0,0,.8)' }, { boxShadow: '0 60px 120px -30px rgba(0,0,0,.8), 0 0 90px rgba(52,211,153,.25)', duration: 1.2 }, t0 + 3.2);
        tl.to('#termwin', { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, t0 + b.dur - 0.4);
      }

      /* ── end card ── */
      {
        const b = B.end, t0 = b.start;
        tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, t0);
        tl.fromTo('#e_logo', { scale: 0.78, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 1.2, ease: 'expo.out' }, t0 + 0.25);
        const a = split(document.getElementById('e_t1')), c = split(document.getElementById('e_t2'));
        rise(a, C('h2').start - 0.4, { s: 0.09, d: 1.0 }); rise(c, C('h2').start - 0.0, { s: 0.09, d: 1.0 });
        tl.fromTo('#e_arc', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: 'expo.out' }, C('h2').start + 0.9);
        tl.fromTo('#e_url', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: 'expo.out' }, C('h2').end - 0.3);
        tl.to('#root', { backgroundColor: '#080d19', duration: 0.01 }, 0);
      }

      /* ── captions: each word lights as it is spoken ── */
      document.querySelectorAll('.cap').forEach((cap) => {
        const t0 = +cap.dataset.t0, t1 = +cap.dataset.t1, last = cap.dataset.last === '1', words = cap.querySelectorAll('.cw'), box = cap.querySelector('.box');
        tl.fromTo(box, { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: 'expo.out' }, t0 - 0.08);
        tl.to(box, { opacity: 0, y: -8, duration: 0.2, ease: 'power2.in' }, t1 + (last ? 0.22 : 0.04));
        const wts = [...words].map((w) => w.textContent.length + 2), tot = wts.reduce((a, b) => a + b, 0); let acc = 0; const span = t1 - t0 - 0.08;
        words.forEach((w, i) => { tl.to(w, { opacity: 1, duration: 0.12, ease: 'power1.out' }, t0 + (acc / tot) * span); acc += wts[i]; });
      });

      gsap.set('#prog', { scaleX: 0 });
      tl.to('#prog', { scaleX: 1, duration: D.total, ease: 'none' }, 0);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
