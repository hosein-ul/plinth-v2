packages:
  - "apps/*"
  - "packages/*"
# esbuild's postinstall is only an optimisation; the platform binary ships as an optional dependency.
strictDepBuilds: false
ignoredBuiltDependencies:
  - esbuild
# Security: transitive packages with published advisories (wallet SDK trees). Remove an entry once the tree resolves a fixed version by itself.
overrides:
  ws: ">=8.21.0"
  uuid: ">=11.1.1"
  decode-uri-component: ">=0.5.0"
  esbuild: ">=0.25.0"
